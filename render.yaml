databases:
  - name: savannah-health-db
    plan: free
    region: oregon
    databaseName: savannah_health
    user: savannah

services:
  - type: web
    name: savannah-health-system
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/Dmmkuliku/savannah-health-system
    branch: main
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Savannah Health System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: savannah-health-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: savannah-health-db
          property: connectionString
      - key: APP_KEY
        generateValue: true
      - key: TRUSTED_PROXIES
        value: "*"
      - key: APP_URL
        sync: false
